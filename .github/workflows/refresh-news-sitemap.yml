name: Publish static news pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-static-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static news pages from Firebase
        run: node scripts/generate-static-news.mjs
      - name: Publish generated pages
        run: |
          git add -A -- index.html news.html news-sitemap.xml generated-news
          if git diff --cached --quiet; then
            echo "Static news pages are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish static news pages from Firebase"
          git push
